name: Build and push image and chart to qcr
on:
  push:
    branches:
      - main
    tags:
      # Build tags minted by bin/create-qumulo-tag.sh: the upstream release
      # the branch is rebased onto, the number of Qumulo commits on top and
      # the commit they end at, e.g. v1.11.0-qumulo-029-2cccc1d.
      - "v[0-9]+.[0-9]+.[0-9]+-qumulo-[0-9]+-[0-9a-f]+"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: qcr.corp.qumulo.com
      IMAGE: qcr.corp.qumulo.com/engineering/niks3
      CHARTS: oci://qcr.corp.qumulo.com/engineering/charts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
      - name: Build Docker image
        run: |
          nix build .#niks3-docker --print-build-logs
      - name: Connect to tailnet
        # qcr.corp.qumulo.com is only reachable from inside the corp network.
        # tailscale comes from nixpkgs (pinned by flake.lock) rather than
        # tailscale/github-action, whose run-time download from
        # pkgs.tailscale.com took out qompass dev deploys during that CDN's
        # 2026-07-16 outage. The OAuth client secret is accepted directly as an
        # auth key (?ephemeral&preauthorized) for the client's tags. Ephemeral +
        # mem: state, so the node evaporates when the runner dies.
        env:
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -xe
          TS="$(nix build --inputs-from . nixpkgs#tailscale --no-link --print-out-paths)"
          sudo setsid nohup bash -c "exec '$TS/bin/tailscaled' --state=mem:" \
            >/tmp/tailscaled.log 2>&1 &
          for i in $(seq 1 30); do
            [ -S /var/run/tailscale/tailscaled.sock ] && break
            if [ "$i" = 30 ]; then echo "tailscaled did not start:"; cat /tmp/tailscaled.log; exit 1; fi
            sleep 1
          done
          timeout 120 sudo "$TS/bin/tailscale" up \
            --auth-key="${TS_OAUTH_SECRET}?ephemeral=true&preauthorized=true" \
            --advertise-tags=tag:github-qumulo \
            --accept-routes --accept-dns=true \
            --hostname="gh-niks3-${GITHUB_RUN_ID}"
          sudo "$TS/bin/tailscale" status --self=true --peers=false
      - name: Push image
        env:
          QCR_USERNAME: ${{ secrets.QCR_USERNAME }}
          QCR_SECRET: ${{ secrets.QCR_SECRET }}
        run: |
          set -xe
          PATH="$(nix build --inputs-from . nixpkgs#regctl --print-out-paths --no-link)/bin:$PATH"
          regctl registry login "$REGISTRY" -u "$QCR_USERNAME" --pass-stdin <<< "$QCR_SECRET"
          regctl image import "ocidir://local:niks3" ./result
          regctl image copy "ocidir://local:niks3" "$IMAGE:${GITHUB_REF_NAME}"
      - name: Push Helm chart
        # Only for build tags: the chart version is the tag without its
        # leading v, so v1.11.0-qumulo-029-2cccc1d becomes chart
        # 1.11.0-qumulo-029-2cccc1d, a SemVer prerelease of the upstream
        # release it is built on (one alphanumeric identifier, compared as
        # ASCII, which the zero-padded count keeps in order). The tag itself
        # is kept as appVersion, which is also the image tag the chart
        # defaults to. Helm and Flux both pin prerelease versions exactly.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          QCR_USERNAME: ${{ secrets.QCR_USERNAME }}
          QCR_SECRET: ${{ secrets.QCR_SECRET }}
        run: |
          set -xe
          PATH="$(nix build --inputs-from . nixpkgs#kubernetes-helm --print-out-paths --no-link)/bin:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          helm registry login "$REGISTRY" -u "$QCR_USERNAME" --password-stdin <<< "$QCR_SECRET"
          helm package deploy/helm/niks3 --version "$VERSION" --app-version "${GITHUB_REF_NAME}" -d dist
          helm push "dist/niks3-${VERSION}.tgz" "$CHARTS"
