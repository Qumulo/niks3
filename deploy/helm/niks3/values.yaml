image:
  # Built by .github/workflows/build-image.yml from the same release tag the
  # chart is published with, so the default tag (the chart's appVersion)
  # always names an image that exists.
  repository: qcr.corp.qumulo.com/engineering/niks3
  tag: "" # defaults to appVersion, the release tag the chart was published with
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicaCount: 1
resources: {}
database:
  # Secret with the Postgres connection string (CloudNativePG: `<cluster>-app`, key `uri`).
  existingSecret: ""
  secretKey: uri
  # Or inline. The chart creates the Secret.
  url: ""
s3:
  # host[:port] the server talks to. Clients upload via presigned URLs, so this
  # must also be reachable from wherever `niks3 push` runs unless publicURL is set.
  endpoint: ""
  # Externally reachable http(s)://host[:port] for presigned URLs when
  # `endpoint` is cluster-internal (e.g. rustfs.rustfs.svc:9000).
  publicURL: ""
  bucket: ""
  region: ""
  useSSL: true
  bucketLookup: auto # auto | dns | path
  # IRSA / Pod Identity instead of keys from `existingSecret` (access-key / secret-key).
  useIAM: false
  existingSecret: ""
  accessKey: ""
  secretKey: ""
auth:
  # Shared API token (>= 36 chars) for uploads and GC. Secret key `token`.
  # Always required (the GC CronJob uses it), also with workloadIdentity.
  existingSecret: ""
  token: ""
  # Allow pods to push with their service account token, see wiki/Kubernetes.
  workloadIdentity:
    enabled: false
    allowedServiceAccounts: [] # "<namespace>:<name>", globs allowed
    scopes: [write] # read | write | admin
    audience: niks3
    issuer: "" # detected from the pod's service account token
  # Further OIDC providers in the server's JSON schema, keyed by name.
  oidcProviders: {}
signing:
  # Secret mounted at /secrets/signing. Holds signing keys and, with `program`,
  # any credentials the program reads, for example an OpenBao token or an HSM PIN.
  existingSecret: ""
  keys: [] # key file names within the Secret, required with existingSecret unless `program` is set
  # Program that signs narinfos, started by the server and configured through
  # extraEnv. It must exist in the image. The image ships /bin/niks3-openbao-signer.
  program: ""
  publicKey: "" # name:base64 public key of the program's key, required with `program`
cacheURL: ""
readProxy:
  enabled: false
  redirectTTL: null # e.g. 15m
  # Send the NAR redirects of clients in `cidrs` to another S3 endpoint that
  # serves the same objects under the same keys, such as a read-only replica
  # of the bucket nearer to them (requires redirectTTL). The first route
  # holding the client wins; other clients get s3.publicURL or s3.endpoint.
  # existingSecret holds the endpoint's `access-key` and `secret-key`, which
  # only sign redirects and so need only read access. The endpoint must serve
  # an object as soon as the primary does (a Qumulo portal of the bucket's
  # directory does); one that copies asynchronously 404s fresh NARs until it
  # catches up, and Nix fails those substitutions.
  redirectRoutes: []
  # - cidrs: ["198.51.100.0/24"]
  #   s3URL: https://replica.example.com:9000
  #   bucket: "" # defaults to s3.bucket
  #   region: "" # defaults to the primary bucket's region
  #   existingSecret: niks3-replica-s3
  # CIDRs of the ingress controller's pods. Their X-Forwarded-For names the
  # client a redirect route is matched against; without them every client
  # looks like the ingress controller. The ingress Service needs
  # `externalTrafficPolicy: Local` (or PROXY protocol): with `Cluster`,
  # kube-proxy rewrites the source address, X-Forwarded-For holds a node IP,
  # and no route ever matches. niks3_read_redirects_total shows which
  # endpoint redirects go to.
  trustedProxies: []
  # Keys one of which must have signed an upstream narinfo for it to be
  # served and stored. The public keys of signing.keys are always trusted.
  trustedKeys: [] # e.g. ["cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="]
  # Fill misses from upstream caches (requires enabled). Upstream narinfos
  # are stored verbatim, so clients keep the upstream key in
  # trusted-public-keys.
  pullThrough:
    upstreams: [] # e.g. ["https://cache.nixos.org"]
    negativeTTL: null # default 1m
    concurrency: null # NAR fills, default 16; each may buffer a 16 MiB part
    narinfoConcurrency: null # default 256
maxNarSize: null # e.g. 4G
cachePriority: null # e.g. 30
debug: false
extraArgs: []
extraEnv: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Mount the service account token. Needed by sidecar injectors such as the
  # OpenBao agent injector. Always on with auth.workloadIdentity.
  automountToken: false
deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: [] # labelSelector is filled in
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  minAvailable: null # must stay below replicaCount
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
service:
  type: ClusterIP
  port: 80
  nodePort: null
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: niks3.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
gc:
  enabled: true
  schedule: "0 3 * * *"
  olderThan: 720h
  failedUploadsOlderThan: 6h
  resources: {}
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
# ConfigMap with the Grafana dashboard, for Grafana's dashboard sidecar.
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
